name: Build DMG Release

# 在推送一个 v* 版本号 tag 时触发（例如 v1.0.0）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (release)
        run: |
          swift build -c release --package-path OwlMonitorApp

      - name: Package DMG
        run: |
          chmod +x scripts/package_dmg.sh
          ./scripts/package_dmg.sh

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OwlMonitor.dmg
